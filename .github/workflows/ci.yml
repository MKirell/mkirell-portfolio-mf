name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    if: vars.CI_ENABLED != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm run test

  deploy:
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the deploy variables are set
        run: |
          missing=""
          for v in AWS_REGION AWS_DEPLOY_ROLE_ARN API_BASE_URL S3_BUCKET CLOUDFRONT_DISTRIBUTION_ID SITE_URL; do
            eval "value=\${$v:-}"
            [ -z "$value" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Repository variables not set:$missing"
            echo "Settings -> Secrets and variables -> Actions -> Variables" >&2
            exit 1
          fi
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Build against the live API
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: npm run build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload fingerprinted assets
        run: |
          aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}/" --delete             --cache-control "public,max-age=31536000,immutable"             --exclude "index.html" --exclude "*.xml" --exclude "*.txt"

      - name: Upload the entry point uncached
        run: |
          aws s3 cp dist/index.html "s3://${{ vars.S3_BUCKET }}/index.html"             --cache-control "public,max-age=0,must-revalidate"             --content-type "text/html; charset=utf-8"
          for f in robots.txt sitemap.xml; do
            [ -f "dist/$f" ] && aws s3 cp "dist/$f" "s3://${{ vars.S3_BUCKET }}/$f"               --cache-control "public,max-age=3600" || true
          done

      - name: Invalidate the edge cache
        run: |
          aws cloudfront create-invalidation             --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"             --paths "/*" >/dev/null

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ vars.SITE_URL }}" || true)
            [ "$code" = "200" ] && echo "live" && exit 0
            sleep 10
          done
          echo "site never returned 200" >&2
          exit 1
